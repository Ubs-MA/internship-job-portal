{% load static %}
<!DOCTYPE html>
<html>
  <head>
    <title>Sign Up</title>
    <link rel="stylesheet" href="{% static 'portal/signup.css' %}" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Sign Up</h1>
        <p>Create your account to get started</p>
      </div>

      <form method="post">
        {% csrf_token %}

        <div class="form-group">{{ form.as_p }}</div>

        <div class="role-section">
          <label><strong>Account Type:</strong></label>
          <div class="radio-group">
            <div class="radio-option">
              <input
                type="radio"
                id="student"
                name="role"
                value="student"
                required
              />
              <label for="student">Student</label>
            </div>
            <div class="radio-option">
              <input
                type="radio"
                id="company"
                name="role"
                value="company"
                required
              />
              <label for="company">Company</label>
            </div>
          </div>
        </div>

        <button type="submit" class="submit-btn">Sign Up</button>
      </form>

      <div class="footer-links">
        <p>Already have an account? <a href="{% url 'login' %}">Login</a></p>
        <p class="back-link"><a href="{% url 'home' %}">← Back to Home</a></p>
      </div>
    </div>
  </body>
</html>
