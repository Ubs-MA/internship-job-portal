{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post a New Job</title>
    <link rel="stylesheet" href="{% static 'portal/post_job.css' %}" />
</head>
<body>
    <div class="dashboard-container">
        <header class="dashboard-header">
            <h1>Post a New Job/Internship</h1>
            <a href="{% url 'job_list' %}" class="action-link">← Back to Job List</a>
        </header>

        <section class="main-content">
            <form method="post">
                {% csrf_token %}
                <label>Title:</label>
                <input type="text" name="title" required>

                <label>Description:</label>
                <textarea name="description" rows="8" required></textarea>

                <label>Location:</label>
                <input type="text" name="location" required>

                <label>Type:</label>
                <select name="job_type">
                    <option value="job">Full-time Job</option>
                    <option value="internship">Internship</option>
                </select>

                <button type="submit" class="primary-action">Post Job</button>
            </form>
        </section>
    </div>
</body>
</html>
